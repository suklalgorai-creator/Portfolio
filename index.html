  <meta name="description" content="Portfolio of Suklal Gorai, a web and mobile developer from Jamshedpur building useful software and thoughtful digital experiences.">
  <meta name="author" content="Suklal Gorai">
  <meta name="theme-color" content="#F7F8FF">
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('sg_theme');
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#14151C');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }());
  </script>
